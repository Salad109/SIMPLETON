<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  fragments/nav.html
  Usage: <nav th:replace="~{fragments/nav :: nav('stats')}"></nav>
  activePage: 'stats' | 'conjunctions' | 'catalog' | 'playground' | '' (satellite/viz detail pages)

  #nav-status is filled by the page.
-->
<nav class="app-nav" th:fragment="nav(activePage)">
    <button aria-label="Open menu" class="nav-burger" onclick="toggleDrawer()">
        <span></span><span></span><span></span>
    </button>
    <a class="nav-brand" href="/"
       title="Satellite Intersection Monitoring Pipeline for Locating Every Threatening Orbital Neighbor">SIMPLETON</a>
    <div class="nav-drawer">
        <div class="nav-links">
            <a class="nav-link" href="/"
               th:classappend="${activePage == 'stats'} ? ' active' : ''">Stats</a>
            <a class="nav-link" href="/conjunctions"
               th:classappend="${activePage == 'conjunctions'} ? ' active' : ''">Conjunctions</a>
            <a class="nav-link" href="/catalog"
               th:classappend="${activePage == 'catalog'} ? ' active' : ''">Satellite Catalog</a>
            <a class="nav-link" href="/playground"
               th:classappend="${activePage == 'playground'} ? ' active' : ''">Playground</a>
        </div>
        <div class="nav-right" id="nav-status">
            <!-- Filled by pages that hx-get a nav-status fragment on load. -->
        </div>
        <button class="theme-btn" onclick="toggleTheme()" title="Toggle light/dark"></button>
    </div>
    <div class="nav-backdrop" onclick="closeDrawer()"></div>
</nav>
</html>
